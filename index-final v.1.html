<title>Amul Parlour Stock</title>
<style>
:root{
  color-scheme:light;
  --bg:#F3F3FA; --surface:#FFFFFF; --ink:#1C1A4A; --ink2:#434F68; --muted:#586379; --line:#D6DDEA; --soft:#F4F6FB;
  --accent:#D4004A; --accent-ink:#FFFFFF; --accent-soft:#FDE3EC; --navy:#283182; --sun:#E66134;
  --head:"Playfair Display",Georgia,"Times New Roman",serif;
  --rev:#2a78d6; --spend:#eb6834;
  --good:#17703F; --good-soft:#DFF3E7; --warn:#8A5200; --warn-soft:#FFF0D1; --bad:#B3261E; --bad-soft:#FCE3E1;
  --shadow:0 1px 2px rgba(20,40,60,.08),0 4px 14px rgba(20,40,60,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12112E; --surface:#1D1C46; --ink:#E8ECF6; --ink2:#BCC6DA; --muted:#9AA6BF; --line:#2A3555; --soft:#1F2846;
    --accent:#FF5C93; --accent-ink:#2A0412; --accent-soft:#3F1730; --navy:#A9A6F2; --sun:#E66134;
    --rev:#3987e5; --spend:#d95926;
    --good:#5CCB8B; --good-soft:#163425; --warn:#F0B454; --warn-soft:#3A2B10; --bad:#FF8A80; --bad-soft:#3F1B19;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;font-family:var(--head);font-style:italic;font-weight:800}
.num,input.qty,.kpi b,td.n,.val{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* POS console */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pos{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pos-top{display:flex;flex-direction:column;gap:8px}
.pos-search input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);padding:0 14px;font-size:16px;background:var(--surface);color:var(--ink)}
.pos-btns{display:flex;gap:8px;flex-wrap:wrap}
.pos-btns .btn{flex:1 1 auto;min-height:42px}
.pos-sum{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0}
.pos-sum .btn{width:100%}
.pos-cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.cchip{flex:0 0 auto;min-height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;font-weight:600;display:flex;gap:6px;align-items:center;cursor:pointer;font-size:14px}
.cchip small{color:var(--muted);font-weight:600}
.cchip .cdot{width:10px;height:10px;border-radius:50%;background:var(--tc,#9AA5B1);flex:none}
.cchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.pos-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start}
.pos-h{grid-column:1/-1;margin:10px 0 0;font-size:15px;border-left:5px solid var(--tc);padding-left:8px}
.pos-empty{grid-column:1/-1}
.tile{position:relative;min-height:84px;border:1px solid var(--line);border-left:5px solid var(--tc,#9AA5B1);border-radius:12px;background:var(--surface);color:var(--ink);padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.tile:active{transform:scale(.98)}
.tile b{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.pos.mgr .tile b{padding-right:26px}
.tp{font-weight:800;color:var(--accent);font-size:16px}
.tg{font-size:11px;color:var(--muted)}
.tile.nop{opacity:.6}.tile.nop .tp{color:var(--muted);font-weight:500;font-size:13px}
.tile.tub{cursor:default}
.tsz{display:flex;gap:6px}
.tsz button{flex:1;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;cursor:pointer;font-size:12px}
.tsz button span{color:var(--accent);font-size:15px}

function salesCsv(start, end) {

  $('#g-go').onclick = go; $('#g-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  $('#g-local').onclick = () => { localStorage.setItem(K + '.local', '1'); location.reload(); };
  setTimeout(() => $('#g-code').focus(), 50);
}
if (!Cloud.load() && localStorage.getItem(K + '.local') !== '1') { window.__gated = true; showGate(); }
else { if (isStaff() && !['stock', 'more', 'sell'].includes(UI.tab)) UI.tab = 'stock'; UI.loading = !!Cloud.load(); render(); Cloud.start(); if (UI.loading) setTimeout(() => { if (UI.loading) { UI.loadFail = 'The cloud did not answer in time.'; render(); } }, 20000); Cloud.updBanner(); }
document.addEventListener('click', (e) => { const id = e.target && e.target.id; if (id === 'ld-retry') location.reload();
  if (id === 'ld-out') { if (!confirm('Sign out of this phone? Your data is safe in the cloud. You will need the access code again.')) return; localStorage.removeItem(K + '.cloud'); localStorage.removeItem(K + '.local'); location.reload(); }
  if (id === 'ld-rule') { const c = Cloud.load() || {}; openModal('<h2>Firestore rule</h2><p class="muted">Paste this in Firebase Console > Firestore > Rules, then Publish. Only the owner can fix this.</p><pre style="white-space:pre-wrap;font-size:12px;background:#f4f4f4;padding:8px;border-radius:8px">' + esc(ruleText(c.sk, c.mk)) + '</pre><div class="actions"><button class="btn pri" id="ld-copy">Copy rule</button><button class="btn" data-close>Close</button></div>'); }
  if (id === 'ld-copy') { const c = Cloud.load() || {}; copyText(ruleText(c.sk, c.mk)).then((ok) => toast(ok ? 'Rule copied' : 'Could not copy')); } });

</script>
