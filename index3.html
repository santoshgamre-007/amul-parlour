<style>
:root{
  color-scheme:light;
  --bg:#F3F3FA; --surface:#FFFFFF; --ink:#1C1A4A; --ink2:#434F68; --muted:#586379; --line:#D6DDEA; --soft:#F4F6FB;
  --accent:#D4004A; --accent-ink:#FFFFFF; --accent-soft:#FDE3EC; --navy:#283182; --sun:#E66134;
  --head:"Playfair Display",Georgia,"Times New Roman",serif;
  --rev:#2a78d6; --spend:#eb6834;
  --good:#17703F; --good-soft:#DFF3E7; --warn:#8A5200; --warn-soft:#FFF0D1; --bad:#B3261E; --bad-soft:#FCE3E1;
  --shadow:0 1px 2px rgba(20,40,60,.08),0 4px 14px rgba(20,40,60,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12112E; --surface:#1D1C46; --ink:#E8ECF6; --ink2:#BCC6DA; --muted:#9AA6BF; --line:#2A3555; --soft:#1F2846;
    --accent:#FF5C93; --accent-ink:#2A0412; --accent-soft:#3F1730; --navy:#A9A6F2; --sun:#E66134;
    --rev:#3987e5; --spend:#d95926;
    --good:#5CCB8B; --good-soft:#163425; --warn:#F0B454; --warn-soft:#3A2B10; --bad:#FF8A80; --bad-soft:#3F1B19;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;font-family:var(--head);font-style:italic;font-weight:800}
.num,input.qty,.kpi b,td.n,.val{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:0;z-index:20;background:#283182;color:#fff;border-bottom:4px solid #E66134;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;box-shadow:var(--shadow)}
.top .iconbtn,.top .btn{background:#fff;color:#283182;border-color:#fff}
.top .iconbtn:active,.top .btn:active{background:#E8E7F7}
.top .row1{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:44px;width:auto;display:block;flex:none}
.brand b{font-family:var(--head);font-style:italic;font-weight:800;font-size:19px;line-height:1.1;display:block}
.brand small{color:#D9D8F5;font-size:13px}
.top .chip{border-color:#fff;background:#fff;color:#283182}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.chip.ok i{background:var(--good)} .chip.err i{background:var(--bad)} .chip.wait i{background:var(--warn)}
.weekbar{display:flex;align-items:center;gap:8px;margin-top:8px}
.weekbar .lbl{flex:1;text-align:center;font-weight:700;line-height:1.2}
.weekbar .lbl small{display:block;color:#D9D8F5;font-weight:500;font-size:12px}
.iconbtn{min-width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:20px;cursor:pointer}
.iconbtn:active{background:var(--soft)}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;min-height:56px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--sun)}
@media (min-width:860px){
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:104px;order:2;justify-content:center;gap:6px;border-top:0;border-bottom:1px solid var(--line);padding:4px}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:8px;padding:8px 16px;font-size:15px;min-height:44px;border-radius:10px}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft)}
}
main{width:100%;max-width:980px;margin:0 auto;padding:12px 12px 28px;order:3}
.top{order:1}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:8px}
.card h3{font-size:15px;margin:10px 0 6px}
.muted{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-family:var(--head);font-style:italic;font-weight:800;font-size:26px;line-height:1.15;margin-top:2px}
.kpi small{color:var(--muted);font-size:12px}
.kpi.rev b{color:var(--rev)} .kpi.spend b{color:var(--spend)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.rev b{color:#6fa8ee}:root:not([data-theme="light"]) .kpi.spend b{color:#f08a5c}}
.kpi.rev b{color:#1F5FB0} .kpi.spend b{color:#B84A1C}
.note{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.good{background:var(--good-soft);color:var(--good)}
.note b{font-weight:700}
.note button{margin-left:auto;white-space:nowrap}

/* forms */
label.f{display:block;margin:10px 0 0;font-size:14px;color:var(--ink2);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;margin-top:4px}
textarea{min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* stock */
.search{position:sticky;top:112px;z-index:5;background:var(--bg);padding:2px 0 8px}
@media (min-width:860px){.search{top:162px}}
.live{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin:2px 2px 8px}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:52px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.grp[open]>summary::after{transform:rotate(-135deg)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.gname{font-family:var(--head);font-style:italic;font-weight:800;font-size:17px}
.gsum{color:var(--muted);font-size:13px;margin-left:6px}
.row{padding:10px 14px;border-top:1px solid var(--line)}
.row .rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.row .nm{font-weight:600}
.row .used{font-size:13px;color:var(--muted);white-space:nowrap}
.row .used.ok{color:var(--good);font-weight:700}
.row .used.bad{color:var(--bad);font-weight:700}
.ins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-items:end}
.ins .cl{font-size:11px;line-height:1.15;color:var(--muted);display:block;min-height:26px}
.calc{display:flex;align-items:center;justify-content:center;min-height:46px;margin-top:2px;border-radius:10px;background:var(--soft);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.calc.bad{background:var(--bad-soft);color:var(--bad)}
.wl{display:flex;gap:8px;align-items:flex-end;margin-top:6px}.wl label{width:104px;flex:none;font-size:11px;color:var(--muted)}.wl .wr{flex:1;margin:0}
.cmp h3{margin:0 0 6px;font-size:16px}.cmp p.sub{margin:6px 0 0}
.wr{margin-top:6px}.wr select{min-height:40px;font-size:14px}
.ins label{font-size:12px;color:var(--muted);display:block}
input.qty{width:100%;min-height:46px;margin-top:2px;text-align:center;font-size:17px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px}
input.qty::placeholder{color:#8C97A5;opacity:1}
input.qty.bad{border-color:var(--bad);background:var(--bad-soft)}
input.qty.has{background:var(--soft)}
@media (min-width:700px){
  .row{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:14px;align-items:center}
  .row .rh{display:block;margin:0}
  .row .rh .used{display:block;margin-top:2px}
}
.empty{padding:30px 12px;text-align:center;color:var(--muted)}

/* dashboard cards */
.dcards{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media (min-width:760px){.dcards{grid-template-columns:1fr 1fr}}
.dc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.dc h2{font-size:18px;color:var(--navy);margin:0 0 10px}
.dc .top2{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dc .btns{display:flex;gap:8px;flex-wrap:wrap}
.dc .stats{flex:1;min-width:200px;max-width:320px;margin-left:auto}
.dc .st{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:15px;background:none;border:0;width:100%;text-align:left;cursor:pointer}
.dc .st span:first-child{color:var(--navy);font-weight:600}
.dc .st b{font-variant-numeric:tabular-nums}
.bars6{display:grid;grid-template-columns:repeat(6,1fr);height:120px;margin-top:14px;border-bottom:1px solid var(--line)}
.bars6>div{border-left:1px solid var(--line);display:flex;align-items:flex-end;padding:0 6px}
.bars6>div:first-child{border-left:0}
.bars6 i{display:block;width:100%;min-height:2px;border-radius:4px 4px 0 0}
.bars6 i.past{opacity:.45}
.lbls6{display:grid;grid-template-columns:repeat(6,1fr);font-size:12px;color:var(--ink2);text-align:center;padding-top:4px}
.lbls6 b{color:var(--ink)}
/* more / seg / badges / order */
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#12112E}}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.ok{background:var(--good-soft);color:var(--good)}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.li .l1{flex:1;min-width:0}.li .l1 b{display:block}.li .r1{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.li .r1 b{font-size:18px}
.sub{font-size:13px;color:var(--muted)}
/* sheets */
.sheets{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.shbtn{min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:4px 14px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink)}
.shbtn small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.shbtn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}.shbtn[aria-pressed="true"] small{color:#D9D8F5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .shbtn[aria-pressed="true"],:root:not([data-theme="light"]) .shbtn[aria-pressed="true"] small{color:#12112E}}
/* charts */
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin:2px 0 6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:12px;background:var(--soft);border-radius:0 6px 6px 0;position:relative}
.hb .track i{display:block;height:100%;border-radius:0 6px 6px 0;min-width:2px}
.hb .val{font-weight:600;text-align:right;min-width:62px}
svg.trend{width:100%;height:auto;display:block}
svg.trend text{fill:var(--ink2);font-size:11px}
svg.trend .sel{fill:var(--ink);font-weight:700}
svg.trend line{stroke:var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:600;font-size:13px}
table.t td.n,table.t th.n{text-align:right}
details.tv{margin-top:8px} details.tv summary{cursor:pointer;color:var(--ink2);font-size:14px;padding:6px 0}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 10px;border-radius:8px;font-size:13px;max-width:260px;display:none;box-shadow:var(--shadow)}

/* items / bills lists */
.item{padding:12px 14px;border-top:1px solid var(--line)}
.item.off{opacity:.6}
.bill{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bill .b1{flex:1;min-width:0}
.bill .b1 b{display:block}
.bill .amt{font-weight:700;white-space:nowrap}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:70;display:none;max-width:90vw}
pre.rule{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;overflow:auto;white-space:pre}
#gate{display:none;max-width:440px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 24px}
#gate .logo{background:#283182;border-bottom:4px solid #E66134;border-radius:14px 14px 0 0;padding:14px;display:flex;align-items:center;gap:12px;color:#fff}
#gate .logo img{height:44px;width:auto}
#gate .card{border-radius:0 0 14px 14px}
#gate input,#gate textarea{width:100%;min-height:48px;font-size:18px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);box-sizing:border-box}
#gate textarea{font-size:13px;min-height:90px}
#gate .err{color:var(--bad);font-weight:600;min-height:1.4em}
body.gated>header.top,body.gated>#view,body.gated>#tabs{display:none}
body.gated #gate{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function niceMax(v) { if (v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }

  const max = niceMax(Math.max(...data.map((d) => Math.max(d.rev, d.spend))));
  const W = 640, H = 230, L = 44, R = 8, T = 16, B = 34; const pw = W - L - R, ph = H - T - B; const gw = pw / data.length; const bw = Math.min(22, gw / 2 - 4);

  data.forEach((d, i) => {

function parseFirebaseConfig(raw) {
  raw = String(raw || '').trim(); if (!raw) return null;
  try { const j = JSON.parse(raw); if (j && j.projectId && j.apiKey) return j; } catch (_) {}
  const o = {}; const re = /["']?([A-Za-z_]\w*)["']?\s*:\s*(?:"([^"]*)"|'([^']*)'|`([^`]*)`)/g; let m;
  while ((m = re.exec(raw))) { const v = m[2] ?? m[3] ?? m[4]; if (['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId', 'measurementId', 'databaseURL'].includes(m[1])) o[m[1]] = v; }
  return o.apiKey && o.projectId ? o : null;
}

/* ---------- modal ---------- */
function openModal(html) { $('#modal-box').innerHTML = html; $('#modal').classList.add('on'); const f = $('#modal-box input,#modal-box select'); if (f) f.focus(); }
function closeModal() { $('#modal').classList.remove('on'); }
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
async function copyText(t) { try { await navigator.clipboard.writeText(t); return true; } catch (_) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok; } }
const csvCell = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
function weekCsv() {
  const c = calcWeek(UI.week); const lines = [['Group', 'Item', 'Previous balance', 'Stock used', 'Balance now', 'New stock', 'In freezer', 'Wasted', 'Waste reason', 'Revenue per unit', 'Estimated sell']];
  c.rows.forEach((r) => lines.push([r.it.g, r.it.n, r.open, r.used ?? '', r.cb ?? '', r.recv, r.close ?? '', r.wasted || '', r.wasted ? (r.e.wr || WASTE[0]) : '', Math.round(r.unit * 100) / 100, Math.round(r.rev * 100) / 100]));
  const aw = actualWeek(UI.week);
  lines.push([], ['Estimated sell', '', '', '', '', '', '', '', '', '', Math.round(c.rev * 100) / 100], ['Actual sell (bank)', '', '', '', '', '', '', '', '', '', aw ?? ''], ['Spent on bills', '', '', '', '', '', '', '', '', '', c.spend]);
  return lines.map((l) => l.map(csvCell).join(',')).join('\n');
}

    localStorage.setItem(K + '.cloud', JSON.stringify({ firebase: fb, shop, sk, mk })); toast('Connecting…'); await Cloud.start(); return render();
  }
  if (t.id === 'c-link-s' || t.id === 'c-link-m') { const c = Cloud.load(); if (!c || !c.sk || !c.mk) return; const staff = t.id === 'c-link-s'; const msg = 'Amul Ice-cream Parlour app: open ' + location.origin + location.pathname + ' and sign in with this ' + (staff ? 'staff' : 'manager') + ' code: ' + fmtCode(staff ? c.sk : c.mk); return toast((await copyText(msg)) ? (staff ? 'Staff message copied. Paste it into WhatsApp.' : 'Manager message copied. Keep it private.') : 'Could not copy'); }
  if (t.id === 's-name') { try { localStorage.setItem(K + '.by', $('#s-by').value.trim()); } catch (_) {} return toast('Name saved'); }
  if (t.id === 'c-off') { const synced = Cloud.st.ready; if (!confirm(synced ? 'Sign out of this phone? Your data stays safe in the cloud and comes back when you sign in again.' : 'Sign out? This phone is not synced right now, so its data is kept on the phone.')) return; localStorage.removeItem(K + '.cloud'); localStorage.removeItem(K + '.local'); if (synced) localStorage.removeItem(K); location.reload(); return; }
  if (t.id === 'rule-copy') return toast((await copyText($('#rule').textContent)) ? 'Rule copied' : 'Could not copy');
  if (t.id === 'bk-dl') return download('parlour-backup-' + todayISO() + '.json', JSON.stringify(S), 'application/json');
  if (t.id === 'bk-copy') return toast((await copyText(JSON.stringify(S))) ? 'Backup copied' : 'Could not copy');
  if (t.id === 'bk-rs') return openModal(`<h2>Restore a backup</h2><p class="muted">This replaces all stock, bills and prices${Cloud.st.ready ? ', for everyone on cloud sync' : ' on this phone'}.</p><label class="f">Backup file<input type="file" id="rs-file" accept=".json,application/json"></label><label class="f">Or paste the backup text<textarea id="rs-text"></textarea></label><div class="actions"><button class="btn danger" id="rs-go">Replace everything</button><button class="btn" data-close>Cancel</button></div>`);
});
document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.id === 'n-save') { const n = $('#n-n').value.trim(); if (!n) return toast('Enter a name'); const k = $('#n-k').value; const p = parseNum($('#n-p').value), pl = parseNum($('#n-pl').value);
    S.meta.items.push({ id: uid(), g: $('#n-g').value, n, k, ps: k === 'tub' ? p : null, pl: k === 'tub' ? pl : null, p: k === 'std' ? p : null, on: true }); touch('meta'); closeModal(); toast('Item added'); render(); }
  if (t.id === 'rs-go') {
    let txt = $('#rs-text').value.trim(); const f = $('#rs-file').files[0]; if (f) txt = await f.text();
    try { const j = JSON.parse(txt); if (!j.meta || !Array.isArray(j.meta.items)) throw new Error('bad'); if (!confirm('Replace all current data with this backup?')) return;
      S = j; S.weeks = S.weeks || {}; S.bills = S.bills || {}; S.batches = S.batches || { updated: 0, list: [] }; S.issues = S.issues || { updated: 0, list: [] }; S.credits = S.credits || { updated: 0, list: [] }; const now = Date.now(); S.meta.updated = now; S.batches.updated = now; S.issues.updated = now; S.credits.updated = now; Object.values(S.weeks).forEach((w) => (w.updated = now)); Object.values(S.bills).forEach((b) => (b.updated = now)); persist(); Cloud.pushAll(); closeModal(); toast('Backup restored'); render();
    } catch (_) { toast('That is not a valid backup'); }
  }
});
/* tooltip for chart marks */
const tip = $('#tip');
document.addEventListener('pointerover', (e) => { const t = e.target.closest('[data-tip]'); if (!t) return; tip.textContent = t.dataset.tip; tip.style.display = 'block'; });
document.addEventListener('pointermove', (e) => { if (tip.style.display === 'block') { tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + 'px'; tip.style.top = e.clientY + 14 + 'px'; } });
document.addEventListener('pointerout', (e) => { if (e.target.closest && e.target.closest('[data-tip]')) tip.style.display = 'none'; });
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('[data-tip]')) tip.style.display = 'none'; });

view.addEventListener('click', (e) => {
  const t = e.target;
  const shb = t.closest('[data-sheet]'); if (shb) { UI.sheet = shb.dataset.sheet; return render(); }
  if (t.id === 'sh-add') { const w = weekDoc(UI.week); w.more = w.more || []; const m = { id: uid(), d: defDate(UI.week), a: true, e: {} }; w.more.push(m); UI.sheet = m.id; touch('week:' + UI.week); return render(); }
  if (t.id === 'sh-del') { if (!confirm('Delete this count and everything entered in it?')) return; const w = weekDoc(UI.week); w.more = (w.more || []).filter((x) => x.id !== UI.sheet); UI.sheet = null; touch('week:' + UI.week); return render(); }
  if (t.id === 'cr-save') { const k = $('#cr-k').value; const p = k === 'm' ? $('#cr-m').value : UI.week; const a = parseNum($('#cr-a').value); if (!p) return toast('Choose the month'); if (a == null || Number.isNaN(a) || a < 0) return toast('Enter the amount as a number');
    const l = S.credits.list; const i = l.findIndex((x) => x.k === k && x.p === p); const rec = { id: i >= 0 ? l[i].id : uid(), k, p, a, note: $('#cr-n').value.trim(), by: byName() }; if (i >= 0) l[i] = rec; else l.push(rec); touch('credits'); toast('Bank credit saved'); return render(); }
  const cd = t.closest('[data-crdel]'); if (cd) { if (!confirm('Delete this bank credit?')) return; S.credits.list = S.credits.list.filter((x) => x.id !== cd.dataset.crdel); touch('credits'); return render(); }
  const sb = t.closest('[data-sub]'); if (sb) { UI.sub = sb.dataset.sub; return render(); }
  const oc = t.closest('[data-ord-copy]'), ow = t.closest('[data-ord-wa]');
  if (oc || ow) { const sid = (oc || ow).dataset.ordCopy ?? (oc || ow).dataset.ordWa; const list = orderPlan().filter((p) => (p.it.sp || '') === sid); const txt = orderText(sid, list);
    if (ow) return window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank'); return copyText(txt).then((ok) => toast(ok ? 'Order copied. Paste it in WhatsApp.' : 'Could not copy')); }
  if (t.id === 'x-save') { const i = $('#x-i').value, ex = $('#x-e').value, q = parseNum($('#x-q').value); if (!i) return toast('Choose the item'); if (!ex) return toast('Enter the expiry date'); if (q == null || Number.isNaN(q)) return toast('Enter the quantity left');
    const rec = { id: UI.editBatch || uid(), i, ex, q, b: $('#x-b').value.trim(), n: $('#x-n').value.trim(), by: byName() }; const l = S.batches.list; const k = l.findIndex((x) => x.id === rec.id); if (k >= 0) l[k] = rec; else l.push(rec);
    UI.editBatch = null; touch('batches'); toast('Batch saved'); return render(); }
  if (t.id === 'x-cancel') { UI.editBatch = null; return render(); }
  const be = t.closest('[data-bedit]'); if (be) { UI.editBatch = be.dataset.bedit; render(); return window.scrollTo(0, 0); }
  const bd = t.closest('[data-bdel]'); if (bd) { if (!confirm('Remove this batch?')) return; S.batches.list = S.batches.list.filter((x) => x.id !== bd.dataset.bdel); touch('batches'); toast('Batch removed'); return render(); }
  if (t.id === 'is-save') { const d = $('#is-d').value; if (!d) return toast('Choose the date'); const a = parseNum($('#is-a').value); if (Number.isNaN(a)) return toast('Lost sales must be a number');
    S.issues.list.push({ id: uid(), d, s: $('#is-s').value, t: $('#is-t').value, n: $('#is-n').value.trim(), a: a || 0, by: byName() }); touch('issues'); toast('Problem saved'); return render(); }
  const idl = t.closest('[data-isdel]'); if (idl) { if (!confirm('Delete this entry?')) return; S.issues.list = S.issues.list.filter((x) => x.id !== idl.dataset.isdel); touch('issues'); return render(); }
});
view.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'sh-d' || t.id === 'sh-a') { const w = weekDoc(UI.week); const sid = curSheetId(); const tgt = sid === 'main' ? w : (w.more || []).find((x) => x.id === sid); if (!tgt) return;
    if (t.id === 'sh-a') tgt.a = t.checked; else { const v = t.value; if (!v || v < UI.week || v > addDays(UI.week, 6)) { toast('Choose a date inside this week'); return render(); } tgt.d = v; }
    touch('week:' + UI.week); return render(); }
  if (t.id === 'cr-k') { $('#cr-wrap').style.display = t.value === 'm' ? '' : 'none'; $('#cr-hint').style.display = t.value === 'm' ? 'none' : ''; } if (t.dataset.wr) { const se = sheetE(UI.week, curSheetId()); const en = (se[t.dataset.wr] = se[t.dataset.wr] || {}); en.wr = t.value; touch('week:' + UI.week); } });
/* join link: #join=<base64 of {firebase,shop,sk[,mk]}> connects a device. Without a manager key the device becomes a staff device. */
(function () {
  try {
    const m = location.hash.match(/join=([^&]+)/);
    if (m) { const j = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); if (j.firebase && j.shop && j.sk) { localStorage.setItem(K + '.cloud', JSON.stringify(j)); UI.tab = j.mk ? 'dash' : 'stock'; setTimeout(() => toast(j.mk ? 'Connected as owner or manager' : 'Connected as staff'), 400); } history.replaceState(null, '', location.pathname + location.search); }
  } catch (_) { setTimeout(() => toast('That link is not valid'), 400); }
})();
/* sign-in gate: one web address; the access code decides staff or manager */
const fbBase = () => { if (EMBED.firebase) return { firebase: EMBED.firebase, shop: EMBED.shop }; try { return JSON.parse(localStorage.getItem(K + '.fb') || 'null'); } catch (_) { return null; } };
function showGate() {
  document.body.classList.add('gated'); const need = !fbBase(); const img = document.querySelector('.brand img').src;
  $('#gate').innerHTML = `<div class="logo"><img alt="Amul" src="${img}"><div><b>Ice-cream Parlour</b><br><small>Stock and bills</small></div></div>
  <div class="card"><h2>Sign in</h2><p class="muted">Type your access code. The app opens the right view for you.</p>
  <label class="f">Access code<input type="text" id="g-code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx"></label>
  ${need ? `<label class="f">Firebase web config (needed once on this phone)<textarea id="g-cfg" placeholder="const firebaseConfig = { apiKey: …, projectId: … };"></textarea></label><label class="f">Shop code<input type="text" id="g-shop" value="${esc(EMBED.shop || '')}" autocapitalize="off"></label>` : ''}
  <p class="err" id="g-msg" role="alert"></p>
  <div class="actions"><button class="btn pri" id="g-go">Sign in</button></div>
  <p class="sub" style="margin-top:14px">Owner setting this up for the first time, or no sharing needed? <button class="btn sm" id="g-local">Use on this phone only</button></p>
  <p class="sub">Version ${VERSION}</p></div>`;
  const go = async () => {
    const msg = $('#g-msg'), btn = $('#g-go'); msg.textContent = ''; const code = $('#g-code').value.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (code.length < 12) { msg.textContent = 'That code is too short. Check it and try again.'; return; }
    let base = fbBase();
    if (!base) { const fb = parseFirebaseConfig($('#g-cfg').value), shop = $('#g-shop').value.trim().replace(/[^\w-]/g, ''); if (!fb || shop.length < 4) { msg.textContent = 'Enter the Firebase web config and the shop code. The owner can give you both.'; return; } base = { firebase: fb, shop }; }
    btn.disabled = true; btn.textContent = 'Checking…';
    try {
      const r = await Cloud.probe(base.firebase, base.shop, code);
      if (!r) { msg.textContent = 'This code is not recognised. Check it, or ask the owner.'; }
      else if (r.role === 'manager' && !r.sk) { msg.textContent = 'Manager code accepted, but staff sharing is not set up yet. On the owner phone open More > Settings and tap Connect, then try again.'; }
      else { if (!EMBED.firebase) localStorage.setItem(K + '.fb', JSON.stringify(base)); localStorage.setItem(K + '.cloud', JSON.stringify(r.role === 'manager' ? { firebase: base.firebase, shop: base.shop, sk: r.sk, mk: code } : { firebase: base.firebase, shop: base.shop, sk: code })); location.reload(); return; }
    } catch (e) { console.error(e); msg.textContent = 'Cannot reach the cloud. Check the internet and try again.'; }
    btn.disabled = false; btn.textContent = 'Sign in';
  };
  $('#g-go').onclick = go; $('#g-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  $('#g-local').onclick = () => { localStorage.setItem(K + '.local', '1'); location.reload(); };
  setTimeout(() => $('#g-code').focus(), 50);
}
if (!Cloud.load() && localStorage.getItem(K + '.local') !== '1') { showGate(); }
else { if (isStaff() && !['stock', 'more'].includes(UI.tab)) UI.tab = 'stock'; render(); Cloud.start(); }
